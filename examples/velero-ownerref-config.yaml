apiVersion: v1
kind: ConfigMap
metadata:
  name: velero-ownerref-config
  namespace: velero
  labels:
    velero.io/plugin-config: ""
data:
  # inScope defines API groups and GroupKinds eligible for ownerReference remapping.
  # Note: Leaf workloads (Pod, ReplicaSet, ReplicationController, Job) are permanently denied by the engine.
  inScope: |
    - group: cluster.x-k8s.io
    - group: controlplane.cluster.x-k8s.io
    - group: bootstrap.cluster.x-k8s.io
    - group: infrastructure.cluster.x-k8s.io
    - group: ipam.cluster.x-k8s.io
    - group: addons.cluster.x-k8s.io
    - group: ""
      kind: PersistentVolumeClaim

  # specRefPaths defines dotted spec.* paths pointing to parent resources whose UIDs must be remapped.
  specRefPaths: |
    - group: cluster.x-k8s.io
      kind: Cluster
      jsonPaths:
        - spec.infrastructureRef
        - spec.controlPlaneRef
    - group: cluster.x-k8s.io
      kind: Machine
      jsonPaths:
        - spec.infrastructureRef
        - spec.bootstrap.configRef

  # quiesceOnRestore defines temporary pause annotations injected during Phase 1A create
  # to silence declarative controllers while dependent children are restored.
  # Annotations are removed automatically after Phase 1B remapping.
  quiesceOnRestore: |
    - group: cluster.x-k8s.io
      kind: Cluster
      annotationKey: cluster.x-k8s.io/paused
      annotationValue: ""
